name: que_se_hace
description: "¿K hace! — Tu guia urbana inteligente para Medellin."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.12.0
  flutter_riverpod: 2.5.1
  google_fonts: ^8.0.2
  flutter_svg: ^2.2.4
  go_router: ^17.1.0
  shared_preferences: ^2.5.4
  mapbox_maps_flutter: ^2.0.0
  geolocator: ^13.0.2
  permission_handler: ^11.3.1
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^7.0.0
  flutter_launcher_icons: ^0.14.4
  freezed: ^3.0.0
  json_serializable: ^6.9.5
  build_runner: ^2.4.15

flutter:
  uses-material-design: true
  assets:
    - lib/assets/background.gif
    - lib/assets/logos/
    - lib/assets/icons/
    - lib/assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: lib/assets/logos/logo_200x200.png
  min_sdk_android: 21
  remove_alpha_ios: true
